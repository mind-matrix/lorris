name: Deploy to GitHub Pages

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Only one deployment at a time; don't cancel one that's already publishing.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Type-check
        run: npm run check

      - name: Test
        run: npm test

      - name: Build
        run: npm run build
        env:
          # Project pages live at https://<owner>.github.io/<repo>/
          BASE_PATH: /${{ github.event.repository.name }}/
          # Optional TURN relays (repository secrets; empty = relay not used). See .env.example.
          VITE_METERED_APP: ${{ secrets.VITE_METERED_APP }}
          VITE_METERED_API_KEY: ${{ secrets.VITE_METERED_API_KEY }}
          VITE_TURN_URLS: ${{ secrets.VITE_TURN_URLS }}
          VITE_TURN_USERNAME: ${{ secrets.VITE_TURN_USERNAME }}
          VITE_TURN_CREDENTIAL: ${{ secrets.VITE_TURN_CREDENTIAL }}

      - name: Check relay settings in the build
        # Fails on a half-configured relay, or a secret that didn't make it into the build.
        run: node scripts/check-relay-build.mjs dist
        env:
          VITE_METERED_APP: ${{ secrets.VITE_METERED_APP }}
          VITE_METERED_API_KEY: ${{ secrets.VITE_METERED_API_KEY }}
          VITE_TURN_URLS: ${{ secrets.VITE_TURN_URLS }}
          VITE_TURN_USERNAME: ${{ secrets.VITE_TURN_USERNAME }}
          VITE_TURN_CREDENTIAL: ${{ secrets.VITE_TURN_CREDENTIAL }}

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
